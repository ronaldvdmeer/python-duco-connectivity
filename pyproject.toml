[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-duco-connectivity"
version = "0.1.0"
description = "Async HTTP client for the local Duco Connectivity API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Ronald van der Meer" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "aioresponses>=0.7",
    "bandit>=1.7",
    "mypy>=1.8",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.11",
]

[project.urls]
Homepage = "https://github.com/ronaldvdmeer/python-duco-connectivity"
Repository = "https://github.com/ronaldvdmeer/python-duco-connectivity"
Issues = "https://github.com/ronaldvdmeer/python-duco-connectivity/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duco_connectivity = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=duco_connectivity",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["duco_connectivity"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
